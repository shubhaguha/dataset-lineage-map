papers:
- id: truth
  name: Truth finding
  subtitle: VLDB 2013
  full: >-
    Truth finding on the deep web: is the problem solved? (Li, Dong, Lyons, Meng, Srivastava), PVLDB 6(2) 2013
  column: 1
  row: 0.0
  url: https://doi.org/10.14778/2535568.2448943
  created:
  - 'Stock: 55 sources, July 2011 (not used downstream on this map)'
- id: holistic
  name: Holistic
  subtitle: ICDE 2013
  full: 'Holistic data cleaning: putting violations into context (Chu, Ilyas, Papotti), ICDE 2013'
  column: 1
  row: 3.345
  url: https://doi.org/10.1109/ICDE.2013.6544847
  note: >-
    Errors were injected into all three datasets at a set rate. Datasets: da.qcri.org/hc/data.zip (per the paper).
  created:
  - 'EMP: synthetic, follows the paper''s running example; up to 100K tuples, 17 attributes, 2 relations'
- id: nadeef
  name: NADEEF
  subtitle: SIGMOD 2013
  full: 'NADEEF: a commodity data cleaning system (Dallachiesa et al.), SIGMOD 2013'
  column: 1
  row: 4.517
  url: https://doi.org/10.1145/2463676.2465327
- id: bart
  name: BART
  subtitle: VLDB 2015 · error generator
  full: >-
    Messing up with BART: error generation for evaluating data-cleaning algorithms (Arocena et al.), PVLDB 9(2) 2015
  column: 2
  row: 7.517
  url: https://doi.org/10.14778/2850578.2850579
  note: >-
    BART injects errors into clean data. Its repository (db.unibas.it/projects/bart) is the source Raha and Baran cite for Tax.
  created:
  - 'Employees: the paper''s running example, synthetic, 100K–1M tuples'
- id: dde
  name: Detecting data errors
  subtitle: VLDB 2016 · 5 real datasets
  full: 'Detecting data errors: where are we and what needs to be done? (Abedjan et al.), PVLDB 9(12) 2016'
  column: 2
  row: 12.345
  url: https://doi.org/10.14778/2994509.2994518
  note: >-
    All five datasets have real errors and ground truth from the data owners. Only Merck and Rayyan Bib (and, if the inference holds, BlackOak) reached later benchmarks.
- id: holoclean
  name: HoloClean
  subtitle: VLDB 2017
  full: >-
    HoloClean: holistic data repairs with probabilistic inference (Rekatsinas, Chu, Ilyas, Ré), PVLDB 10(11) 2017
  column: 3
  row: 4.0
  url: https://doi.org/10.14778/3137628.3137631
- id: raha
  name: Raha
  subtitle: SIGMOD 2019 · 8 datasets
  full: 'Raha: a configuration-free error detection system (Mahdavi et al.), SIGMOD 2019'
  column: 4
  row: 8.0
  url: https://doi.org/10.1145/3299869.3324956
  note: >-
    The BigDaMa/raha GitHub repo distributes beers, flights, hospital, movies_1, rayyan and tax with dirty and clean versions. IT and Address are not in it.
- id: baran
  name: Baran
  subtitle: VLDB 2020 · 7 datasets
  full: >-
    Baran: effective error correction via a unified context representation and transfer learning (Mahdavi & Abedjan), PVLDB 13(12) 2020
  column: 4
  row: 11.345
  url: https://doi.org/10.14778/3407790.3407801
- id: rein
  name: REIN
  subtitle: EDBT 2023 · 14 datasets
  full: >-
    REIN: a comprehensive benchmark framework for data cleaning methods in ML pipelines (Abdelaal, Hammacher, Schöning), EDBT 2023
  column: 4
  row: 17.0
  url: https://arxiv.org/abs/2302.04702
  note: >-
    Only the 3 datasets that reach ADR are drawn. REIN also uses Hospital, Beers, Flights and others not traced here.
- id: cleanml
  name: CleanML
  subtitle: ICDE 2021 · 14 datasets
  full: >-
    CleanML: a study for evaluating the impact of data cleaning on ML classification tasks (Li et al.), ICDE 2021
  column: 4
  row: 19.5
  url: https://arxiv.org/abs/1904.09483
  note: >-
    Only Titanic, Restaurant and Credit are drawn. CleanML's other datasets (e.g. Airbnb, USCensus, Movie) aren't traced here. Dataset sources: github.com/chu-data-lab/CleanML, DatasetDescriptions.pdf.
- id: retadult
  name: Retiring Adult
  subtitle: NeurIPS 2021 · folktables
  full: >-
    Retiring Adult: new datasets for fair machine learning (Ding, Hardt, Miller, Schmidt), NeurIPS 2021: introduces the folktables package
  column: 4
  row: 23.0
  url: https://github.com/zykls/folktables
  note: >-
    Proposes retiring UCI Adult and replacing it with ACS census tasks through the folktables package. Only the path to TKDE is drawn.
- id: tkde
  name: demodq (TKDE)
  subtitle: TKDE 2024 · 5 datasets
  full: >-
    Automated data cleaning can hurt fairness in machine learning-based decision making (Guha, Khan, Stoyanovich, Schelter), IEEE TKDE 36(12) 2024; extends the ICDE 2023 paper
  column: 5
  row: 24.172
  url: https://doi.org/10.1109/TKDE.2024.3365524
  note: >-
    Extends the CleanML benchmark code with fairness metrics, but cites each dataset from its public source. There is no clean ground truth: missing values, outliers and label errors are flagged by automated detectors and then auto-repaired. Sensitive attributes follow prior fairness work.
- id: adr
  name: Automatic Data Repair
  subtitle: VLDB 2024 · 12 datasets
  full: 'Automatic data repair: are we ready to deploy? (Ni et al.), PVLDB 17(10) 2024'
  column: 5
  row: 13.0
  url: https://doi.org/10.14778/3675034.3675051
  note: >-
    5 datasets with real errors for repair quality, plus 7 ML task datasets (Titanic, Restaurant, Airfoil, 3D Printer, Adult, Dress, Bank). For those, ADR treats the original data as clean and injects errors at 10–90%.
