# Data-quality benchmark lineage map — source data.
# Edit this file, then run:  python build.py data/data-quality.yaml data-quality-lineage.html
#
# datasets: the left column, one entry per original dataset, in display order (row = position).
#   id is used in links[].datasets; name is the bold label; source is the subtitle.
# papers:   every other box. column indexes into `columns` (>= 1); row may be fractional.
# links:    from (data source) -> to (paper that used it). how: paper (stated in the citing
#           paper) | inferred (dashed). label_pos (0-1) / label_dy / offset fine-tune drawing.
# intro, panel_hint and footer may contain simple HTML (<b>, <br>, <a>).

page_title: Data Quality Benchmark Lineage Map
title: Where data-cleaning benchmark datasets come from
intro: >-
  Each line runs from where a paper says it got a dataset to the paper that used it, labelled with the dataset name. Recent benchmarks such as <b>Automatic Data Repair (VLDB 2024)</b> use the same handful of tables, which reach them through two or three papers. <b>Hospital</b> started as 100K rows from Hospital Compare, was cut to 1,000 rows by HoloClean, and every later paper reuses that sample. <b>Tax</b> is synthetic, generated by BART from a 2008 scenario by Fan et al. <b>IT</b>, <b>Rayyan</b> and probably <b>Address</b> are organisation-provided tables first described in <b>Detecting data errors (VLDB 2016)</b>. Pick a dataset below, or a box in the left column, to follow it through every paper. Hover over or tap a paper to see what it took and passed on.
svg_title: >-
  Lineage graph of data-cleaning benchmark datasets, from original sources (left) to the papers that use them (right), by year
panel_hint: >-
  Select a paper or source to see which datasets it used, where each came from and who reused them. Pick a dataset chip above to follow one table through every paper.<br><br>Hover over a line to see the citing paper's own description of that dataset.
footer: >-
  Sources: the dataset sections and references of each paper on the map, read in full (ADR, Raha, Baran, HoloClean, BART, Detecting data errors, Holistic, NADEEF, Truth finding, REIN, CleanML, demodq TKDE 2024), CleanML's dataset descriptions and the BigDaMa/raha GitHub repository (November 2026). Dashed links are inferences, not claims made by the authors. Download links come from the papers and were not re-checked.
links_legend:
  paper: Source stated in the citing paper
  inferred: Inferred (matching table shapes)
columns:
- Original data
- '2013'
- 2015–2016
- '2017'
- 2019–2023
- '2024'
kinds:
  paper:
    label: Paper
    legend: Paper (system or benchmark)
    color: series-1
  open:
    label: Public source
    legend: Public source (open data portal, web, repository)
    color: series-3
  org:
    label: Organisation-provided / proprietary
    legend: Organisation-provided or proprietary
    color: series-2
  synth:
    label: Synthetic scenario
    legend: Synthetic scenario
    color: series-4
  unk:
    label: Origin not traced
    legend: Origin not traced
    color: neutral
