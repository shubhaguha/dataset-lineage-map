      Same terms of use as the Chicago Face Database: non-commercial scientific research only, no redistribution, no identifying
      or contacting models, at most four images in publications without permission. Download link emailed on request, with
      CFD and CFD-INDIA. 88 real multiracial individuals with self-reported race and ethnic ancestry. Models signed an in-person
      release for research use and were paid $20–$100 (Ma, Kantner & Wittenbrink 2020). No withdrawal mechanism is described.
    commercial: Non-commercial only
    consent: Signed release, research use
