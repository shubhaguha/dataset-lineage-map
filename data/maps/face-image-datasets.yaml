# Face image dataset lineage map: where each dataset's images came from.
# Build:  python build.py   (whole site into docs/; this map becomes docs/face-image-datasets.html)
#
# Uses the extended schema: no traced `datasets` column; every box is a dataset under `nodes`,
# coloured by image origin (kinds), with a status, attrs shown in the panel/table (node_fields),
# several refs, family bands (lanes) and typed links (link_types).
# Positions are automatic: `year` picks the column (year_columns), `lane` the family band, and
# build.py chooses rows (layout.auto_rows). Years come from the Face Dataset Provenance Knowledge
# Base; approximate or unknown years carry a year_note. Related publications (kind: pub) are linked
# with `covered` lines, which are not lineage, and can be greyed out or hidden (toggles).

page_title: Face Dataset Lineage Map
title: Shared provenance of face datasets
intro: >-
  Each line shows where a dataset's <b>images</b> came from. 23 of the 40 entries take their images from another dataset,
  and LFW alone has <b>20 known derivatives</b>, shown here as 5 individual datasets and 2 groups. <b>Six datasets have been
  withdrawn (dashed borders), and derivatives of four of those are still distributed.</b> RFW, BFW and LAOFIW take only their
  names from LFW: none of them contains LFW images. Hover or tap a dataset to trace its lineage. Columns give each dataset's
  <b>release year</b>; boxes on the right are <b>publications that document these datasets</b>, which can be greyed out or
  hidden.
svg_title: Lineage graph of face datasets grouped by upstream source
panel_hint: >-
  Select a dataset to see its terms, its parents and children, and a link to its primary source.<br><br>Datasets shown with
  no lines have no upstream source shared with any other dataset here.
footer: >-
  Sources: dataset pages and papers, Exposing.ai, and Peña et al. 2023, gathered in the <a href="kb.html">knowledge base</a>.
  Status of VGGFace is assumed, not verified. Years come from the knowledge base; the few that are approximate or unknown
  are marked in each dataset's panel.
node_table_title: Table view (40 entries plus Flickr and 4 publications)
