# Dataset knowledge base: one record per dataset, shared by every map in data/maps/.
# Build:  python build.py   (writes docs/kb.html together with the map pages)
#
# Face records were exported from the Face Dataset Provenance Knowledge Base (Notion) on
# 2026-11-11, with Notion relations converted to record ids. This file is now the source of
# truth: edit here. Data-quality records hold only id, name and topics; their facts (source,
# path, sizes, where to get it) live in the map YAML and are gathered onto the KB page at build
# time, per map (`source` is filled from the first map that traces the dataset). A map box links to the record with the same id, or the one named by its `kb:` key.

title: Dataset knowledge base
intro: >-
  Provenance, terms and consent for the datasets on the lineage maps. Filter by topic, search, or open a record to see every
  field and the maps it appears on.
topics:
  faces:
    label: Faces
  data-quality:
    label: Data quality
  fairness:
