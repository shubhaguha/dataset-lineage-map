- id: cfd
  name: Chicago Face Database (CFD)
  topics:
  - faces
  full_name: >-
    Chicago Face Database, with CFD-MR and CFD-INDIA extension sets (University of Chicago, Center for Decision Research)
  year: 2015
  image_origin: Consented participants
  status: On request
  role:
  - Attribute / age
  identities: 827
  demographic_labels:
  - Age
  - Gender
  - Race / ethnicity
  - Self-reported
  label_method: >-
    Self-identified race/ethnicity and gender (CFD-MR: self-reported multiracial ancestry). Norming data add physical face
    measurements and ratings by independent judges (e.g. perceived age, attractiveness); CFD-INDIA includes ratings by both
    U.S. and Indian raters.
  dataset_terms: >-
    Free; non-commercial scientific research only. Terms of use: no publishing of the materials in any form without written
    consent from the University of Chicago, Center for Decision Research. The site's FAQ softens this for papers: sample images
    are allowed, but limited to at most four unless the methods require more; a permission request form is provided for publishers
    who need formal permission. No redistribution to third parties, including file hosting and cloud-based AI image-manipulation
    services (added April 2024). No attempts to identify or contact the people pictured, including facial recognition. Use
    must be acknowledged. Download link emailed after a request form.
  image_rights: >-
    Studio photographs taken by the research team; the University of Chicago, Center for Decision Research, holds the copyright.
    No per-image third-party licences.
  commercial_use: Non-commercial only
  redistribution: Prohibited
  derivatives_allowed: Partial
  subject_consent: Signed release (research use)
  key_concerns: >-
    Unlike the scraped datasets here, the images were taken in a lab, so there is one rights holder and no Flickr licence
    chain. Edited faces (e.g. morphs) can be made for research. The site's FAQ allows up to four sample images in a paper,
    but its formal terms say the materials can't be published without written consent, so get the permission form signed if
    your publisher asks. Sending images to cloud AI-editing tools is explicitly banned. Consent: all three sets used a signed,
    in-person release for research use, with payment (CFD: $20; CFD-MR: $20–$100; CFD-INDIA: Rs. 500, bilingual forms, read
    aloud where needed, University of Chicago IRB approval). None of the papers describes a way to withdraw. The FHIBE paper
    (Xiang et al., Nature 2025) notes CFD publishes no consent details on its site. Images were retouched (earrings, piercings
    and facial hair removed), except where CFD-INDIA models kept cultural or religious items. It's a psychology stimulus set
    with standardized poses and lighting, so it's not representative of faces in the wild.
  verification: Terms read at source
  sources: >-
    chicagofaces.org (terms of use, FAQ, image sets, version history); Ma, Correll & Wittenbrink (2015), Behavior Research
    Methods 47:1122–1135 (recruitment and consent); Ma, Kantner & Wittenbrink (2020), BRM 53:1289–1300 (Method: target recruitment,
    photographing; read 2026-11-11); Lakshmi et al. (2021), Frontiers in Psychology 12:627678 (Method and ethics statement;
    read 2026-11-11); Xiang et al. (2025), Nature 648:97–108 (consent comparison)
  primary_url: https://www.chicagofaces.org/
- id: feret
  name: FERET
  topics:
  - faces
  full_name: Facial Recognition Technology (FERET) database; distributed by NIST as Color FERET (Version 2)
  year: 1998
  status: On request
  role:
  - Face recognition training
  - Face recognition eval
  images: 14126
  identities: 1199
  dataset_terms: >-
    Color FERET Release Agreement v1: case-by-case release to face recognition researchers via NIST download only. No further
    distribution, publication, copying or dissemination in any form, for profit or not, including within your own organization.
    Images may appear only in technical reports and papers on face recognition research, at most 15 at a time. Mandatory acknowledgement
    and citation. Violations mean loss of access and civil damages for publishing unapproved images.
  image_rights: >-
    Photographed for the FERET program at George Mason University and US Army Research Laboratory facilities on 35mm colour
    film; George Mason University collected, processed and maintained the database. Distributed by NIST on behalf of the DoD
    Counterdrug Technology Development Program. No public licence on the images.
  commercial_use: Unclear
  redistribution: Prohibited
  derivatives_allowed: 'No'
  key_concerns: >-
    Built by a US defense program to develop face recognition for security, intelligence and law enforcement. The terms are
    among the strictest here: no redistribution even inside your own organization. Publishing is limited to 15 images in papers
    "reporting on face recognition research", so a fairness study of face recognition fits, but work in another field (e.g.
    a hiring testbed that only uses the faces as inputs) may not. Commercial use isn't addressed directly; the release is
    to face recognition researchers on a case-by-case basis. Consent: neither the 1998 paper (full text read) nor NIST's pages
    or release agreement say how subjects were recruited, whether they consented or were paid. The sequestered test set also
    included digitally altered images (changes to scale, lighting and clothing colour), so the program itself edited real
    faces.
  verification: Terms read at source
  sources: >-
    NIST Color FERET page and Release Agreement v1 (read 2026-11-11); NIST FERET program page; Phillips, Wechsler, Huang &
    Rauss (1998), Image and Vision Computing 16(5):295–306 (full text read 2026-11-11: section 4.2 and acknowledgements);
    Phillips, Moon, Rizvi & Rauss (2000), IEEE TPAMI 22:1090–1104
  primary_url: https://www.nist.gov/itl/products-and-services/color-feret-database
