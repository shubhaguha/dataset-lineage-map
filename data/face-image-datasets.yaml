# Face image dataset lineage map: where each dataset's images came from.
# Build:  python build.py data/face-image-datasets.yaml face-dataset-lineage.html
#
# Uses the extended schema: no traced `datasets` column; every box is a dataset under `nodes`
# (column + y in px), coloured by image origin (kinds), with a status, attrs shown in the
# panel/table (node_fields), several refs, family bands (lanes) and typed links (link_types).

page_title: Face Dataset Lineage Map
title: Shared provenance of face datasets
intro: >-
  Each line shows where a dataset's <b>images</b> came from. 21 of the 34 entries take their images from another dataset, and LFW alone has <b>20 known derivatives</b>, shown here as 5 individual datasets and 2 groups. <b>Six datasets have been withdrawn (dashed borders), and derivatives of four of those are still distributed.</b> RFW, BFW and LAOFIW take only their names from LFW: none of them contains LFW images. Hover or tap a dataset to trace its lineage.
svg_title: Lineage graph of face datasets grouped by upstream source
panel_hint: >-
  Select a dataset to see its terms, its parents and children, and a link to its primary source.<br><br>Datasets shown with no lines have no upstream source shared with any other dataset here.
footer: >-
  Sources: dataset pages and papers, Exposing.ai, and Peña et al. 2023, gathered in the Face Dataset Provenance Knowledge Base in Notion. Status of VGGFace is assumed, not verified.
node_table_title: Table view (34 entries plus Flickr)
