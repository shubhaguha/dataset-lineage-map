<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #8a5cc7;
  --neutral: #898781;
  --band: rgba(11,11,11,0.025);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #9d75d6;
    --band: rgba(255,255,255,0.03);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 28px 28px 72px; }
header { max-width: 1500px; margin: 0 auto 14px; }
h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--text-secondary); font-size: 14.5px; line-height: 1.5; max-width: 900px; margin: 0; }
.lede b { color: var(--text-primary); font-weight: 600; }
.sitenav { display: flex; gap: 16px; font-size: 13px; margin: 0 0 10px; }
.sitenav a { color: var(--series-1); text-decoration: none; font-weight: 600; }
.sitenav a:hover { text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 14px 0 0; font-size: 12.5px; color: var(--text-secondary); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; display: inline-block; }
.ln { width: 26px; height: 0; border-top: 1.75px solid var(--muted); display: inline-block; }
.ln.dash { border-top-style: dashed; }
.ln.dot { border-top-style: dotted; border-top-width: 2px; }
.tracer { max-width: 1500px; margin: 0 auto 14px; padding: 14px 16px 12px; }
.tracer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
.tracer-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
.tracer-hint { font-size: 12.5px; color: var(--text-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 7px 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 12.5px; }
.toolbar { max-width: 1500px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12.5px; }
.toolbar .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 600; margin-right: 4px; }
.dchip { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 13px 7px 10px; border-radius: 999px; border: 1.5px solid var(--axis); background: var(--surface-1); color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.dchip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dchip:hover { border-color: var(--axis); }
.dchip[aria-pressed="true"] { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
.dchip .ct { color: var(--muted); font-size: 11.5px; font-weight: 500; }
.dchip[aria-pressed="true"] .ct { color: var(--axis); }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); cursor: pointer; user-select: none; }
.layout { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1050px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
.chart { padding: 10px; overflow: hidden; }
svg { display: block; width: 100%; height: auto; }
.lane-band { fill: var(--band); }
.lane-label { font-size: 11px; fill: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
.edge.dashed { stroke-dasharray: 5 4; }
.edge.dotted { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.edge.quiet { opacity: 0.3; }
svg.focusing .edge.quiet.on { opacity: 1; }
.col-label { font-size: 11px; fill: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.col-sep { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
.tg-grey { opacity: 0.25; }
svg.focusing .node.tg-grey:not(.dim), svg.focusing .edge.tg-grey.on { opacity: 0.6; }
tr.tg-grey { opacity: 0.45; }
.tg-hide { display: none; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; margin-right: 14px; }
.seg button { font: inherit; font-size: 12.5px; padding: 4px 11px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--page); }
.node.dashed rect.body { stroke-dasharray: 6 4; }
.box-dash { width: 18px; height: 12px; border: 1.75px dashed var(--text-secondary); border-radius: 3px; display: inline-block; }
.chain { font-size: 13px; line-height: 1.6; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 9; cursor: help; }
.edge-label { font-size: 10.5px; fill: var(--text-primary); paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .15s; }
svg.alllabels .edge-label { opacity: 1; }
svg.focusing .edge-label.on { opacity: 1; }
svg.focusing.alllabels .edge-label.dim { opacity: 0.12; }
.node { cursor: pointer; transition: opacity .15s; outline: none; }
.node rect.body { stroke-width: 2; }
.node .name { font-size: 12.5px; font-weight: 600; fill: var(--text-primary); }
.node .sub { font-size: 10.5px; fill: var(--text-secondary); }
.node .hit { fill: transparent; }
.node.dsnode .name { font-size: 13.5px; }
.node:focus-visible rect.body, .node.pinned rect.body { stroke-width: 3; }
svg.focusing .node.dim, svg.focusing .edge.dim { opacity: 0.12; }
svg.focusing .edge.on { stroke-width: 2.3; stroke: var(--text-secondary); }
.panel { padding: 18px 18px 16px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.panel .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 14px 0 4px; }
.panel h2 { font-size: 19px; margin: 0 0 2px; font-weight: 600; }
.panel .full { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 8px; line-height: 1.4; }
.panel p { margin: 0; font-size: 13px; line-height: 1.45; }
.panel ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; }
.panel li { margin-bottom: 5px; }
.panel li .from { color: var(--text-secondary); }
.panel .ds { font-weight: 600; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); margin: 2px 4px 2px 0; color: var(--text-primary); }
.chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.links { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.links a, .panel a { color: var(--series-1); text-decoration: none; font-weight: 600; }
.links a:hover, .panel a:hover { text-decoration: underline; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
details.table { max-width: 1500px; margin: 18px auto 0; padding: 12px 16px; }
details.table summary { cursor: pointer; font-weight: 600; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
td a { color: var(--series-1); }
td.sz { font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot { max-width: 1500px; margin: 14px auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
@media print {
  .viz-root { padding: 10mm; min-height: 0; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel, .toolbar { display: none; }
  details.table { break-before: page; }
  details.table > *:not(summary) { display: block; }
  @page { size: A4 landscape; margin: 8mm; }
}
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <nav class="sitenav" id="sitenav" hidden></nav>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="legend" id="legend" aria-label="Legend"></div>
  </header>

  <section class="card tracer" id="tracer" aria-label="Trace a dataset">
    <div class="tracer-head"><h2>Trace a dataset</h2><span class="tracer-hint">Pick one to follow it from its origin through every paper that used it. The boxes in the left column of the map do the same. The number is how many links carry it.</span></div>
    <div class="chips" id="chips"></div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="labelToggle"> Show all line labels</label>
    </div>
  </section>

  <div class="toolbar" id="toolbar" hidden></div>
  <div class="layout">
    <div class="card chart"><svg id="viz" role="img" aria-labelledby="vizTitle"><title id="vizTitle"></title></svg></div>
    <aside class="card panel" id="panel" aria-live="polite">
      <p class="hint" id="hint"></p>
    </aside>
  </div>

  <details class="card table" id="dtable" open>
    <summary>Dataset table</summary>
    <table id="dtbl"><thead><tr><th>Dataset</th><th>Original source</th><th>Real or synthetic</th><th>Path to recent benchmarks</th><th>Sizes as reported</th><th>Where to get it</th></tr></thead><tbody></tbody></table>
  </details>
  <details class="card table">
    <summary id="ntitle"></summary>
    <table id="ntbl"><thead></thead><tbody></tbody></table>
  </details>
  <p class="foot" id="foot"></p>
</div>

<script id="lineage-data" type="application/json">/*__LINEAGE_DATA__*/</script>
<script>
// ---- Generic lineage renderer. All content comes from the JSON block above (built from YAML by build.py). ----
const DATA = JSON.parse(document.getElementById('lineage-data').textContent);
const LAY = Object.assign({ node_width: 170, node_height: 46, top: 52, row_height: 58, first_x: 24, first_gap: 276, col_gap: 220, min_curve: 40 }, DATA.layout || {});
const W = LAY.node_width, H = LAY.node_height, TOP = LAY.top, ROW = LAY.row_height;
const KIND = Object.fromEntries(Object.entries(DATA.kinds).map(([k, v]) => [k, { label: v.label, legend: v.legend || v.label, v: '--' + v.color }]));
const STATUS = DATA.statuses || {};
const FIELDS = DATA.node_fields || [];
const LL = DATA.links_legend || {};
const LTYPE = DATA.link_types || { paper: { legend: LL.paper || 'Source stated in the citing paper' }, inferred: { legend: LL.inferred || 'Inferred', dashed: true, tag: 'inferred' } };
const COLS = DATA.columns.map((label, i) => ({ label, x: LAY.first_x + (i === 0 ? 0 : LAY.first_gap + (i - 1) * LAY.col_gap) }));
const cx = i => COLS[i].x;
const row = i => TOP + i * ROW;
const posY = (n, i) => n.y != null ? n.y : row(n.row != null ? n.row : i);
const refsOf = (n, isPaper) => n.refs || (n.url ? [{ label: isPaper ? 'Paper (DOI)' : 'Source', short: isPaper ? 'DOI' : 'Source', url: n.url }] : []);

// datasets: the traced left-column boxes (id = dataset key); nodes/papers: all other boxes
const DSLIST = DATA.datasets || [];
const NODES = [...(DATA.papers || []), ...(DATA.nodes || [])];
const D = [
  ...DSLIST.map((d, i) => ({ id: d.id, name: d.name, sub: d.source || '', full: d.source_full || d.source || '', c: 0, y: posY(d, i), k: d.kind, refs: refsOf(d, false), isDs: true })),
  ...NODES.map(p => { const k = p.kind || 'paper'; return { id: p.id, name: p.name, sub: p.subtitle || '', full: p.full || p.name, c: p.column, y: posY(p), k, refs: refsOf(p, k === 'paper'), note: p.note, status: p.status, attrs: p.attrs || {}, own: p.created && p.created.length ? p.created.map(t => ['', t]) : undefined, year: p.year_label || (p.year != null ? String(p.year) : ''), yearNote: p.year_note }; })
];
D.forEach(d => { if (d.year) { if (d.attrs) d.attrs.year = d.year; if (LAY.year_in_subtitle) d.sub = d.year + (d.sub ? ' · ' + d.sub : ''); } });
D.forEach((d, i) => { const src = i < DSLIST.length ? DSLIST[i] : NODES[i - DSLIST.length]; d.x = src.x != null ? src.x : cx(d.c); });
const DS = Object.fromEntries(DSLIST.map(d => [d.id, { name: d.title || d.name, aka: d.aka || '', real: d.real || '', path: d.path || '', sizes: d.sizes || '', get: d.get || '', note: d.note }]));
const E = DATA.links.map(l => ({ lin: (LTYPE[l.how || Object.keys(LTYPE)[0]] || {}).lineage !== false, s: l.from, t: l.to, l: l.label || '', ds: l.datasets || [], how: l.how || Object.keys(LTYPE)[0], n: l.note, lt: l.label_pos, ly: l.label_dy, off: l.offset }));
const tagOf = e => (LTYPE[e.how] || {}).tag || '';
const TOGGLED = new Set((DATA.toggles || []).flatMap(t => t.kinds));
let TOGS = [];
const hiddenEdge = i => [E[i].s, E[i].t].some(id => { const t = TOGS.find(t => t.kinds.has(byId[id].k)); return t && t.mode === 'hide'; });

// page text and legend
document.title = DATA.page_title || DATA.title;
document.getElementById('title').textContent = DATA.title;
document.getElementById('lede').innerHTML = DATA.intro || '';
document.getElementById('vizTitle').textContent = DATA.svg_title || DATA.title;
document.getElementById('hint').innerHTML = DATA.panel_hint || '';
document.getElementById('foot').innerHTML = DATA.footer || '';
(() => {
  const used = new Set(D.map(d => d.k)), usedHow = new Set(E.map(e => e.how)), usedSt = new Set(D.map(d => d.status));
  const sw = k => `<span><i class="sw" style="border-color:var(${KIND[k].v});background:color-mix(in srgb,var(${KIND[k].v}) 14%,transparent)"></i>${KIND[k].legend}</span>`;
  let html = Object.keys(KIND).filter(k => used.has(k)).map(sw).join('');
  html += Object.entries(LTYPE).filter(([k]) => usedHow.has(k) || k === 'paper').map(([k, t]) => `<span><i class="ln${t.dashed ? ' dash' : t.dotted ? ' dot' : ''}"></i>${t.legend}</span>`).join('');
  html += Object.entries(STATUS).filter(([k, s]) => s.dashed && usedSt.has(k)).map(([k, s]) => `<span><i class="box-dash"></i>${s.legend || k}</span>`).join('');
  document.getElementById('legend').innerHTML = html;
  if (!DSLIST.length) document.getElementById('tracer').style.display = 'none';
  if (!DSLIST.length) document.getElementById('dtable').style.display = 'none';
  document.getElementById('ntitle').textContent = DATA.node_table_title || 'Paper and source table';
})();

const byId = Object.fromEntries(D.map(d => [d.id, d]));
const parents = {}, children = {}, xin = {}, xout = {};
D.forEach(d => { parents[d.id] = []; children[d.id] = []; xin[d.id] = []; xout[d.id] = []; });
E.forEach((e, i) => { (e.lin ? parents : xin)[e.t].push(i); (e.lin ? children : xout)[e.s].push(i); });

const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('viz');
const VW = LAY.width || Math.max(...D.map(d => d.x)) + W + 16, VH = LAY.height || Math.max(...D.map(d => d.y)) + H + 30;
svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
if (DATA.labels === 'always') svg.classList.add('alllabels');
if (LAY.min_width) { svg.style.minWidth = LAY.min_width + 'px'; svg.parentNode.style.overflowX = 'auto'; }
const css = getComputedStyle(document.querySelector('.viz-root'));
const el = (t, a, parent = svg) => { const e = document.createElementNS(svgNS, t); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const defs = el('defs', {});
const mk = el('marker', { id:'arr', viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse' }, defs);
el('path', { d:'M0,0 L10,5 L0,10 z', fill:'var(--muted)' }, mk);

if (DATA.lanes) {
  if (DATA.columns.some(c => c)) {
    const y0 = Math.min(...DATA.lanes.map(l => l.y)), y1 = Math.max(...DATA.lanes.map(l => l.y + l.h));
    COLS.forEach((c, i) => {
      if (i) el('line', { class:'col-sep', x1:c.x - (c.x - COLS[i - 1].x - W) / 2, x2:c.x - (c.x - COLS[i - 1].x - W) / 2, y1:y0 - 22, y2:y1, 'data-col':i });
      const t = el('text', { class:'col-label', x:c.x, y:y0 - 10, 'data-col':i }); t.textContent = c.label;
    });
  }
  DATA.lanes.forEach(l => {
    el('rect', { class:'lane-band', x:10, y:l.y, width:VW - 20, height:l.h, rx:10 });
    const t = el('text', { class:'lane-label', x:LAY.first_x, y:l.label_y != null ? l.label_y : l.y + 18 }); t.textContent = l.label;
  });
} else {
  COLS.forEach(c => {
    el('rect', { class:'lane-band', x:c.x - 12, y:8, width:W + 24, height:VH - 16, rx:10 });
    const t = el('text', { class:'lane-label', x:c.x, y:30 }); t.textContent = c.label;
  });
}

// edges
const edgeEls = [], labelEls = [];
const gEdges = el('g', {}), gLabels = el('g', {});
E.forEach((e, i) => {
  const s = byId[e.s], t = byId[e.t], off = e.off || 0;
  const lt = LTYPE[e.how] || {}, vert = s.x === t.x;
  let x1 = s.x + W, y1 = s.y + H/2 + off/2, x2 = t.x - 2, y2 = t.y + H/2 + off, dx = Math.max(LAY.min_curve, (x2 - x1) / 2), d;
  if (vert) { x1 = x2 = s.x + W/2 + off; y1 = s.y + H; y2 = t.y - 2; dx = 0; d = `M${x1},${y1} L${x2},${y2}`; }
  else d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
  const p = el('path', { class:'edge' + (lt.dashed ? ' dashed' : '') + (lt.dotted ? ' dotted' : '') + (lt.quiet ? ' quiet' : ''), d, 'marker-end':'url(#arr)' }, gEdges);
  const hit = el('path', { class:'edge-hit', d }, gEdges);
  const tt = el('title', {}, hit); tt.textContent = `${s.name} → ${t.name}${e.l ? ': ' + e.l : ''}\n${e.n || ''}`;
  hit.addEventListener('mouseenter', () => { if (!pinned && !activeDs) focusEdges(new Set([i])); });
  hit.addEventListener('mouseleave', () => { if (!pinned && !activeDs) clearFocus(); });
  p.dataset.i = i; edgeEls.push(p);
  // label position on the cubic at parameter lt
  const u = e.lt ?? .5, m = 1 - u;
  const lx = m*m*m*x1 + 3*m*m*u*(x1+dx) + 3*m*u*u*(x2-dx) + u*u*u*x2;
  const ly = m*m*m*y1 + 3*m*m*u*y1 + 3*m*u*u*y2 + u*u*u*y2;
  const lb = el('text', vert ? { class:'edge-label', x:x1 + 6, y:(y1 + y2) / 2 + 4 + (e.ly || 0) } : { class:'edge-label', x:lx, y:ly - 4 + (e.ly || 0), 'text-anchor':'middle' }, gLabels);
  lb.textContent = e.l || (LTYPE[e.how] || {}).label || ''; lb.dataset.i = i; labelEls.push(lb);
});

// nodes
const nodeEls = {};
D.forEach(d => {
  const c = css.getPropertyValue(KIND[d.k].v).trim();
  const st = STATUS[d.status] || {};
  const g = el('g', { class:'node' + (st.dashed ? ' dashed' : ''), tabindex:'0', role:'button', 'aria-label':`${d.name}: ${KIND[d.k].label}${d.status ? ', ' + d.status : ''}`, transform:`translate(${d.x},${d.y})` });
  el('rect', { class:'hit', x:-6, y:-6, width:W+12, height:H+12, rx:10 }, g);
  el('rect', { class:'body', width:W, height:H, rx:6, fill:`color-mix(in srgb, ${c} 13%, var(--surface-1))`, stroke:c }, g);
  const n = el('text', { class:'name', x:10, y:19 }, g); n.textContent = d.name;
  const s = el('text', { class:'sub', x:10, y:35 }, g); s.textContent = d.sub || '';
  nodeEls[d.id] = g;
  const isDs = d.isDs;
  if (isDs) g.classList.add('dsnode');
  g.addEventListener('mouseenter', () => { if (!pinned && !activeDs) (isDs ? previewDs(d.id) : focusNode(d.id)); });
  g.addEventListener('focus', () => { if (!pinned && !activeDs) (isDs ? previewDs(d.id) : focusNode(d.id)); });
  g.addEventListener('mouseleave', () => { if (!pinned && !activeDs) clearFocus(); });
  const act = () => isDs ? showDs(d.id) : pin(d.id);
  g.addEventListener('click', ev => { ev.stopPropagation(); act(); });
  g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } if (ev.key === 'Escape') reset(); });
});
svg.addEventListener('click', reset);

let pinned = null, activeDs = null;
const walk = (id, dir, acc = new Set()) => {
  (dir === 'up' ? parents[id] : children[id]).forEach(i => { const o = dir === 'up' ? E[i].s : E[i].t; if (!acc.has(o)) { acc.add(o); walk(o, dir, acc); } });
  return acc;
};
function focusEdges(edgeSet) {
  const keep = new Set(); edgeSet.forEach(i => { keep.add(E[i].s); keep.add(E[i].t); });
  svg.classList.add('focusing');
  for (const k in nodeEls) nodeEls[k].classList.toggle('dim', !keep.has(k));
  edgeEls.forEach((p, i) => { const on = edgeSet.has(i); p.classList.toggle('dim', !on); p.classList.toggle('on', on); labelEls[i].classList.toggle('dim', !on); labelEls[i].classList.toggle('on', on); });
}
function focusNode(id) {
  // edges on any path through this node: ancestors' edges into the lineage + descendants
  const up = walk(id, 'up'), down = walk(id, 'down'), keep = new Set([id, ...up, ...down]);
  const es = new Set();
  E.forEach((e, i) => { if (e.lin && (keep.has(e.s) && keep.has(e.t)) && ((up.has(e.s) || e.s === id) && (up.has(e.t) || e.t === id) || (down.has(e.t) || e.t === id) && (down.has(e.s) || e.s === id))) es.add(i); });
  [...xin[id], ...xout[id]].forEach(i => { if (!hiddenEdge(i)) es.add(i); });
  focusEdges(es);
  renderNode(id);
}
function clearFocus() {
  svg.classList.remove('focusing');
  for (const k in nodeEls) nodeEls[k].classList.remove('dim');
  edgeEls.forEach((p, i) => { p.classList.remove('dim', 'on'); labelEls[i].classList.remove('dim', 'on'); });
}
function reset() {
  pinned = null; activeDs = null;
  for (const k in nodeEls) nodeEls[k].classList.remove('pinned');
  chips.forEach(b => b.setAttribute('aria-pressed', 'false'));
  clearFocus(); panel.innerHTML = hintHTML;
}
function pin(id) {
  activeDs = null; chips.forEach(b => b.setAttribute('aria-pressed', 'false'));
  pinned = pinned === id ? null : id;
  for (const k in nodeEls) nodeEls[k].classList.toggle('pinned', k === pinned);
  if (pinned) focusNode(id); else reset();
}
const dsEdges = key => { const es = new Set(); E.forEach((e, i) => { if (e.ds.includes(key)) es.add(i); }); return es; };
function previewDs(key) { focusEdges(dsEdges(key)); renderDs(key); }
function showDs(key) {
  if (activeDs === key) { reset(); return; }
  pinned = null; for (const k in nodeEls) nodeEls[k].classList.remove('pinned');
  activeDs = key;
  chips.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === key)));
  for (const k in nodeEls) nodeEls[k].classList.toggle('pinned', k === key);
  focusEdges(dsEdges(key)); renderDs(key);
}

// panel
const panel = document.getElementById('panel');
const hintHTML = panel.innerHTML;
const dsLink = k => `<span class="ds" data-ds="${k}">${esc(DS[k].name)}</span>`;
function bindDs() { panel.querySelectorAll('.ds').forEach(s => s.addEventListener('click', () => showDs(s.dataset.ds))); }
const statusChip = d => d.status ? `<span class="chip">${STATUS[d.status] && STATUS[d.status].badge ? STATUS[d.status].badge + ' ' : ''}${esc(d.status)}</span>` : '';
const fieldsHTML = d => FIELDS.filter(f => f.panel !== false && d.attrs[f.key] != null).map(f => `<div class="k">${esc(f.label)}</div><p>${esc(d.attrs[f.key])}${f.key === 'year' && d.yearNote ? `<br><span class="from">${esc(d.yearNote)}</span>` : ''}</p>`).join('');
const crossHTML = id => {
  // non-lineage link types (e.g. 'covered in publication'), grouped by type and direction
  const out = [];
  Object.entries(LTYPE).filter(([, t]) => t.lineage === false).forEach(([how, t]) => {
    const o = xout[id].filter(i => E[i].how === how && !hiddenEdge(i)).map(i => esc(byId[E[i].t].name));
    const n = xin[id].filter(i => E[i].how === how && !hiddenEdge(i)).map(i => esc(byId[E[i].s].name));
    if (o.length) out.push(`<div class="k">${esc(t.panel_out || t.legend)}</div><p>${o.join(', ')}</p>`);
    if (n.length) out.push(`<div class="k">${esc(t.panel_in || t.legend)} (${n.length})</div><p>${n.join(', ')}</p>`);
  });
  return out.join('');
};
const SITE = DATA.site || {};
const kbLink = id => SITE.kb_page && (SITE.kb_ids || {})[id] ? `<a href="${esc(SITE.kb_page)}#${encodeURIComponent(SITE.kb_ids[id])}">Knowledge base entry →</a>` : '';
const refsHTML = d => `<div class="links">${d.refs.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a>`).join('')}${kbLink(d.id)}</div>`;
function chainUp(id, seen = new Set()) {
  // longest path back to a root, for the provenance chain line
  if (seen.has(id)) return [id];
  const ps = parents[id]; if (!ps.length) return [id];
  let best = []; ps.forEach(i => { const c = chainUp(E[i].s, new Set([...seen, id])); if (c.length > best.length) best = c; });
  return [...best, id];
}
function renderNode(id) {
  const d = byId[id], c = css.getPropertyValue(KIND[d.k].v).trim();
  const inc = parents[id].map(i => E[i]), out = children[id].map(i => E[i]);
  const tagged = (e, sep) => tagOf(e) ? sep + tagOf(e) : '';
  const head = `
    <h2>${esc(d.name)}</h2><p class="full">${esc(d.full)}</p>
    <span class="chip"><i style="background:${c}"></i>${esc(KIND[d.k].label)}</span>${statusChip(d)}`;
  if (DATA.panel === 'lineage') {
    // dataset-to-dataset maps: attributes, provenance chain, parents, all descendants
    const chain = chainUp(id), down = [...walk(id, 'down')];
    if (TOGGLED.has(d.k) && !inc.length && !down.length) { panel.innerHTML = `${head}${fieldsHTML(d)}${crossHTML(id)}${d.note ? `<div class="k">Note</div><p>${esc(d.note)}</p>` : ''}${refsHTML(d)}`; return; }
    panel.innerHTML = `${head}
    ${fieldsHTML(d)}
    ${chain.length > 1 ? `<div class="k">Provenance chain</div><p class="chain">${chain.map(k => esc(byId[k].name)).join(' → ')}</p>` : ''}
    <div class="k">Built from</div><p>${inc.length ? inc.map(e => esc(byId[e.s].name) + (tagOf(e) ? ` (${esc(tagOf(e))})` : '')).join(', ') : 'No upstream dataset in this map'}</p>
    <div class="k">Downstream</div><p>${down.length ? down.map(k => esc(byId[k].name)).join(', ') : 'None in this map'}</p>
    ${crossHTML(id)}
    ${d.note ? `<div class="k">Note</div><p>${esc(d.note)}</p>` : ''}
    ${refsHTML(d)}`;
    return;
  }
  const li = (e, other) => `<li><b>${esc(e.l)}</b> <span class="from">${other}${tagged(e, ' · ')}</span>${e.n ? `<br><span class="from">${esc(e.n)}</span>` : ''}</li>`;
  panel.innerHTML = `${head}
    ${fieldsHTML(d)}
    ${inc.length ? `<div class="k">Datasets taken</div><ul>${inc.map(e => li(e, '← ' + esc(byId[e.s].name))).join('')}</ul>` : ''}
    ${d.own ? `<div class="k">Datasets created here</div><ul>${d.own.map(o => `<li>${esc(o[1])}</li>`).join('')}</ul>` : ''}
    ${out.length ? `<div class="k">Supplied to</div><ul>${out.map(e => `<li><b>${esc(e.l)}</b> <span class="from">→ ${esc(byId[e.t].name)}${tagged(e, ' · ')}</span></li>`).join('')}</ul>` : ''}
    ${d.note ? `<div class="k">Note</div><p>${esc(d.note)}</p>` : ''}
    ${DSLIST.length ? `<div class="k">Trace</div><p>${[...new Set([...inc, ...out].flatMap(e => e.ds))].map(dsLink).join(' · ') || '—'}</p>` : ''}
    ${refsHTML(d)}`;
  bindDs();
}
function renderDs(k) {
  const s = DS[k], src = byId[k], c = css.getPropertyValue(KIND[src.k].v).trim();
  const es = E.filter(e => e.ds.includes(k)), u = src.refs[0];
  panel.innerHTML = `
    <h2>${esc(s.name)}</h2>${s.aka ? `<p class="full">Also: ${esc(s.aka)}</p>` : ''}
    <span class="chip"><i style="background:${c}"></i>${esc(KIND[src.k].label)}</span>
    <div class="k">Original source</div><p>${esc(src.sub)}: ${esc(src.full)}${u ? ` · <a href="${esc(u.url)}" target="_blank" rel="noopener">link ↗</a>` : ''}</p>
    ${s.real ? `<div class="k">Real or synthetic</div><p>${esc(s.real)}</p>` : ''}
    ${s.path ? `<div class="k">Path</div><p>${esc(s.path)}</p>` : ''}
    ${s.sizes ? `<div class="k">Sizes as reported</div><p>${esc(s.sizes)}</p>` : ''}
    ${s.note ? `<div class="k">Note</div><p>${esc(s.note)}</p>` : ''}
    ${s.get ? `<div class="k">Where to get it</div><p>${esc(s.get)}</p>` : ''}
    <div class="k">Links on the map (${es.length})</div><ul>${es.map(e => `<li>${esc(byId[e.s].name)} → ${esc(byId[e.t].name)} <span class="from">(${esc(e.l)}${tagOf(e) ? ', ' + esc(tagOf(e)) : ''})</span></li>`).join('')}</ul>${kbLink(k) ? `<div class="links">${kbLink(k)}</div>` : ''}`;
}

// dataset chips
const chipBox = document.getElementById('chips');
const order = DSLIST.map(d => d.id);
const chips = order.map(k => {
  const b = document.createElement('button');
  b.className = 'dchip'; b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
  const n = E.filter(e => e.ds.includes(k)).length;
  b.innerHTML = `<i style="background:${css.getPropertyValue(KIND[byId[k].k].v).trim()}"></i>${esc(DS[k].name)}<span class="ct">${n}</span>`;
  b.title = `${DS[k].name}: ${DS[k].path}`;
  b.addEventListener('click', ev => { ev.stopPropagation(); showDs(k); });
  chipBox.appendChild(b);
  return b;
});
document.getElementById('labelToggle').addEventListener('change', ev => svg.classList.toggle('alllabels', ev.target.checked));

// tables
const dt = document.querySelector('#dtbl tbody');
order.forEach(k => {
  const s = DS[k], tr = document.createElement('tr');
  tr.innerHTML = `<td><b>${esc(s.name)}</b>${s.aka ? `<br><span style="color:var(--text-secondary)">${esc(s.aka)}</span>` : ''}</td><td>${esc(byId[k].sub)}</td><td>${esc(s.real)}</td><td>${esc(s.path)}</td><td class="sz">${esc(s.sizes).replace(/ · /g, '<br>')}</td><td>${esc(s.get)}</td>`;
  dt.appendChild(tr);
});
const NCOLS = DATA.node_table || [
  { col: 'name', label: 'Node' }, { col: 'kind', label: 'Type' }, { col: 'from', label: 'Datasets taken (from)' },
  { col: 'to', label: 'Datasets supplied (to)' }, { col: 'links', label: 'Link' }
];
document.querySelector('#ntbl thead').innerHTML = `<tr>${NCOLS.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr>`;
const nt = document.querySelector('#ntbl tbody');
const cell = (c, d) => {
  if (c.col === 'name') return `<b>${esc(d.name)}</b><br><span style="color:var(--text-secondary)">${esc(d.full)}</span>`;
  if (c.col === 'kind') return esc(KIND[d.k].label);
  if (c.col === 'status') return esc(d.status || '');
  if (c.col === 'field') return esc(d.attrs[c.key] != null ? d.attrs[c.key] : '');
  if (c.col === 'from') return parents[d.id].map(i => E[i].l ? `${esc(E[i].l)} (${esc(byId[E[i].s].name)}${tagOf(E[i]) ? ', ' + esc(tagOf(E[i])) : ''})` : esc(byId[E[i].s].name) + (tagOf(E[i]) ? ` (${esc(tagOf(E[i]))})` : '')).join(E.some(e => e.l) ? '; ' : ', ') || '—';
  if (c.col === 'to') return children[d.id].map(i => E[i].l ? `${esc(E[i].l)} (${esc(byId[E[i].t].name)})` : esc(byId[E[i].t].name)).join(E.some(e => e.l) ? '; ' : ', ') || '—';
  if (c.col === 'year') return esc(d.year || '');
  if (c.col === 'linked') return [...xout[d.id].filter(i => E[i].how === c.how).map(i => E[i].t), ...xin[d.id].filter(i => E[i].how === c.how).map(i => E[i].s)].map(k => `<span data-node="${esc(k)}">${esc(byId[k].name)}</span>`).join(', ') || '—';
  if (c.col === 'links') return d.refs.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.short || r.label)}</a>`).join(' · ');
  return '';
};
const rowEls = {};
D.forEach(d => {
  const tr = document.createElement('tr');
  tr.innerHTML = NCOLS.map(c => `<td>${cell(c, d)}</td>`).join('');
  nt.appendChild(tr); rowEls[d.id] = tr;
});

// toggles: show / grey out / hide groups of node kinds (with their links, table rows and panel mentions)
TOGS = (DATA.toggles || []).map(t => ({ ...t, kinds: new Set(t.kinds), mode: t.default || 'show' }));
function applyToggles() {
  const mode = k => { const t = TOGS.find(t => t.kinds.has(k)); return t ? t.mode : 'show'; };
  const nm = id => mode(byId[id].k);
  D.forEach(d => { const m = nm(d.id); [nodeEls[d.id], rowEls[d.id]].forEach(x => { x.classList.toggle('tg-grey', m === 'grey'); x.classList.toggle('tg-hide', m === 'hide'); }); });
  E.forEach((e, i) => { const m = [nm(e.s), nm(e.t)].includes('hide') ? 'hide' : [nm(e.s), nm(e.t)].includes('grey') ? 'grey' : 'show'; [edgeEls[i], edgeEls[i].nextSibling, labelEls[i]].forEach(x => { x.classList.toggle('tg-grey', m === 'grey'); x.classList.toggle('tg-hide', m === 'hide'); }); });
  // in-table mentions of hidden nodes
  nt.querySelectorAll('[data-node]').forEach(s => s.classList.toggle('tg-hide', nm(s.dataset.node) === 'hide'));
  // shrink the drawing when whole columns are hidden
  const vis = D.filter(d => nm(d.id) !== 'hide'), w = LAY.width || Math.max(...vis.map(d => d.x)) + W + 16;
  svg.setAttribute('viewBox', `0 0 ${w} ${VH}`);
  svg.querySelectorAll('rect.lane-band').forEach(r => r.setAttribute('width', w - 20));
  svg.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('tg-hide', COLS[+x.dataset.col].x >= w));
  if (LAY.min_width) svg.style.minWidth = Math.round(LAY.min_width * w / VW) + 'px';
  if (pinned) renderNode(pinned);
}
if (TOGS.length) {
  const bar = document.getElementById('toolbar'); bar.hidden = false;
  TOGS.forEach(t => {
    const lab = document.createElement('span'); lab.className = 'lbl'; lab.textContent = t.label; bar.appendChild(lab);
    const seg = document.createElement('span'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', t.label);
    [['show', 'Show'], ['grey', 'Grey out'], ['hide', 'Hide']].forEach(([m, txt]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.dataset.m = m;
      b.setAttribute('aria-pressed', String(t.mode === m));
      b.addEventListener('click', () => { t.mode = m; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === m))); applyToggles(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
  });
  applyToggles();
}

// site navigation and deep links (map.html#<box id> selects that box)
if (SITE.nav) {
  const nav = document.getElementById('sitenav'); nav.hidden = false;
  nav.innerHTML = SITE.nav.map(n => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join('');
}
function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!byId[id]) return;
  if (byId[id].isDs) { activeDs = null; showDs(id); } else { pinned = null; pin(id); }
  if (nodeEls[id].scrollIntoView) nodeEls[id].scrollIntoView({ block: 'center', behavior: 'smooth' });
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
