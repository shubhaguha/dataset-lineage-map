<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataset knowledge base</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #8a5cc7;
  --neutral: #898781;
  --band: rgba(11,11,11,0.025);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #9d75d6;
    --band: rgba(255,255,255,0.03);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 28px 28px 72px; }
.wrap { max-width: 1500px; margin: 0 auto; }
.sitenav { display: flex; gap: 16px; font-size: 13px; margin: 0 0 10px; }
.sitenav a, a { color: var(--series-1); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--text-secondary); font-size: 14.5px; line-height: 1.5; max-width: 900px; margin: 0 0 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 0 0 12px; }
.chip { font: inherit; font-size: 13.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px; border: 1.5px solid var(--axis); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.chip .ct { color: var(--muted); font-weight: 500; font-size: 11.5px; margin-left: 5px; }
.chip[aria-pressed="true"] { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
.chip[aria-pressed="true"] .ct { color: var(--axis); }
input[type=search] { font: inherit; font-size: 13.5px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface-1); color: var(--text-primary); min-width: 260px; }
.count { color: var(--muted); font-size: 12.5px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; white-space: nowrap; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; } th[aria-sort="descending"]::after { content: " ▼"; }
tr.rec { cursor: pointer; }
tr.rec:hover td { background: var(--band); }
tr.rec[aria-expanded="true"] td { background: var(--band); border-bottom-color: transparent; }
tr.rec td:first-child b::before { content: "▸ "; color: var(--muted); }
tr.rec[aria-expanded="true"] td:first-child b::before { content: "▾ "; }
.sub { color: var(--text-secondary); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); margin: 1px 3px 1px 0; color: var(--text-secondary); white-space: nowrap; }
.t-faces { border-color: var(--series-1); } .t-data-quality { border-color: var(--series-3); } .t-fairness { border-color: var(--series-4); }
tr.detail td { padding: 4px 8px 18px 22px; background: var(--band); }
dl { display: grid; grid-template-columns: minmax(150px, 210px) 1fr; gap: 6px 16px; margin: 6px 0 0; font-size: 13px; line-height: 1.45; max-width: 1100px; }
dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding-top: 2px; }
dd { margin: 0; }
.onmap { margin-top: 14px; font-size: 13px; }
.onmap h3 { font-size: 13px; margin: 12px 0 2px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }
@media print { .controls, .sitenav { display: none; } }
</style>
</head>
<body>
<div class="viz-root"><div class="wrap">
  <nav class="sitenav" id="sitenav" hidden></nav>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="controls">
    <div id="topics" role="group" aria-label="Filter by topic"></div>
    <input type="search" id="q" placeholder="Search names, terms, sources…" aria-label="Search records">
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="card"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <p class="foot" id="foot"></p>
</div></div>

ics":["faces","fairness"],"full_name":"UTKFace","year":2017,"image_origin":"Web search scrape","status":"Available","role":["Attribute / age","Fairness benchmark"],"images":20000,"demographic_labels":["Age","Gender","Race / ethnicity"],"label_method":"DEX algorithm estimates, checked by one human annotator.","dataset_terms":"Non-commercial research only; copyright with original owners; removal on request.","image_rights":"'Collected from the Internet'; per FairFace paper sources are MORPH, CACD and web search. No per-image source.","commercial_use":"Non-commercial only","redistribution":"Unclear","derivatives_allowed":"Unclear","subject_consent":"None","derived_from":["morph"],"key_concerns":"Untraceable images (filenames have labels + timestamp only). Only partly derived from MORPH.","verification":"Terms read at source","sources":"UTKFace site; FairFace paper","primary_url":"https://susanqq.github.io/UTKFace/","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#utk","box":"UTKFace"}]},{"id":"celeba","name":"CelebA","topics":["faces"],"full_name":"CelebFaces Attributes","year":2015,"image_origin":"Celebrity / profile sites","status":"Available","role":["Attribute / age"],"images":202599,"identities":10177,"demographic_labels":["Gender","Age"],"label_method":"40 binary attributes, annotated (incl. 'Male', 'Young', 'Attractive').","dataset_terms":"Non-commercial research; no copying/publishing/distributing any portion of images or derived data (except internal single-site copies).","image_rights":"Not stated.","commercial_use":"Non-commercial only","redistribution":"Prohibited","derivatives_allowed":"Partial","subject_consent":"None","key_concerns":"Many Hugging Face/Kaggle re-hosts conflict with no-redistribution clause. Strong gender bias in attributes.","in_pena_2023":true,"verification":"Terms read at source","sources":"CelebA agreement","primary_url":"https://mmlab.ie.cuhk.edu.hk/projects/CelebA.html","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#celeba","box":"CelebA"}]},{"id":"laofiw","name":"LAOFIW","topics":["faces","fairness"],"full_name":"Labeled Ancestral Origin Faces in the Wild","year":2018,"image_origin":"Web search scrape","status":"Withdrawn","role":["Fairness benchmark"],"images":14000,"demographic_labels":["Ancestral origin","Gender"],"label_method":"43 nationality search terms + man/woman/boy/girl; 20K results deduped to 14K; manually sorted into 4 groups (sub-Saharan Africa, Indian subcontinent, Europe, East Asia).","dataset_terms":"Privacy notice only; no licence.","image_rights":"Bing Image Search results; copyright with original owners. Only 143 traced to Flickr (115 users), 5 in YFCC100M.","commercial_use":"Unclear","redistribution":"Unclear","derivatives_allowed":"Unclear","subject_consent":"None","key_concerns":"Not derived from LFW despite the name. Download links removed; some images replaced, so current version differs from paper.","in_pena_2023":true,"verification":"Terms read at source","sources":"Oxford VGG page; Alvi et al. ECCVW 2018; Exposing.ai","primary_url":"https://www.robots.ox.ac.uk/~vgg/data/laofiw/","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#laofiw","box":"LAOFIW"}]},{"id":"ppb","name":"PPB","topics":["faces","fairness"],"full_name":"Pilot Parliaments Benchmark","year":2018,"image_origin":"Official portraits","status":"On request","role":["Fairness benchmark"],"images":1270,"demographic_labels":["Gender","Skin type"],"label_method":"Fitzpatrick six-point skin type, annotated.","dataset_terms":"Not confirmed; project page is CC BY-NC-ND 4.0.","image_rights":"Official parliamentary portraits (Rwanda, Senegal, South Africa, Iceland, Finland, Sweden); often public domain or open-licensed, varies by country.","commercial_use":"Unclear","redistribution":"Unclear","derivatives_allowed":"Unclear","subject_consent":"None","key_concerns":"Possibly the cleanest image rights in this set, but dataset terms unverified.","in_pena_2023":true,"verification":"Not checked","sources":"MIT Media Lab Gender Shades page; Peña et al. 2023","primary_url":"https://www.media.mit.edu/projects/gender-shades/overview/","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#ppb","box":"PPB"}]},{"id":"fhibe","name":"FHIBE","topics":["faces","fairness"],"full_name":"Sony Fair Human-Centric Image Benchmark","year":2025,"image_origin":"Consented participants","status":"Available","role":["Fairness benchmark"],"images":10318,"identities":1981,"demographic_labels":["Age","Gender","Ancestral origin","Self-reported"],"label_method":"Self-reported age, pronouns, ancestry.","dataset_terms":"Evaluation only, except training bias detection/mitigation methods; commercial and non-commercial evaluation allowed within terms.","image_rights":"Licensed from paid subjects.","commercial_use":"Evaluation only","redistribution":"Restricted","derivatives_allowed":"Partial","subject_consent":"Informed and revocable","key_concerns":"81 jurisdictions. Hosted by Mozilla Data Collective since 8 Oct 2026, handling GDPR withdrawals; ~500 images being added.","verification":"Terms read at source","sources":"FHIBE datasheet; Business Wire Oct 2026","primary_url":"https://fairnessbenchmark.ai.sony/data-card/fhibe-datasheet","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#fhibe","box":"FHIBE"}]},{"id":"ccv2","name":"Casual Conversations v2","topics":["faces","fairness"],"full_name":"Meta Casual Conversations v2","year":2023,"image_origin":"Consented participants","status":"Available","role":["Fairness benchmark"],"images":26467,"identities":5567,"demographic_labels":["Age","Gender","Self-reported"],"label_method":"Self-provided age, gender, disability and others.","dataset_terms":"Limited licence; evaluation allowed, training only on certain labels.","image_rights":"Licensed from paid participants via vendor.","commercial_use":"Evaluation only","redistribution":"Restricted","derivatives_allowed":"Unclear","subject_consent":"Informed and revocable","key_concerns":"Video, not stills (count is videos). 7 countries. Revocability not separately verified.","verification":"Second-hand","sources":"Meta AI dataset page","primary_url":"https://ai.meta.com/datasets/casual-conversations-v2-dataset/","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#ccv2","box":"Casual Conv. v2"}]},{"id":"cfd","name":"Chicago Face Database (CFD)","topics":["faces"],"full_name":"Chicago Face Database, with CFD-MR and CFD-INDIA extension sets (University of Chicago, Center for Decision Research)","year":2015,"image_origin":"Consented participants","status":"On request","role":["Attribute / age"],"identities":827,"demographic_labels":["Age","Gender","Race / ethnicity","Self-reported"],"label_method":"Self-identified race/ethnicity and gender (CFD-MR: self-reported multiracial ancestry). Norming data add physical face measurements and ratings by independent judges (e.g. perceived age, attractiveness); CFD-INDIA includes ratings by both U.S. and Indian raters.","dataset_terms":"Free; non-commercial scientific research only. Terms of use: no publishing of the materials in any form without written consent from the University of Chicago, Center for Decision Research. The site's FAQ softens this for papers: sample images are allowed, but limited to at most four unless the methods require more; a permission request form is provided for publishers who need formal permission. No redistribution to third parties, including file hosting and cloud-based AI image-manipulation services (added April 2024). No attempts to identify or contact the people pictured, including facial recognition. Use must be acknowledged. Download link emailed after a request form.","image_rights":"Studio photographs taken by the research team; the University of Chicago, Center for Decision Research, holds the copyright. No per-image third-party licences.","commercial_use":"Non-commercial only","redistribution":"Prohibited","derivatives_allowed":"Partial","subject_consent":"Signed release (research use)","key_concerns":"Unlike the scraped datasets here, the images were taken in a lab, so there is one rights holder and no Flickr licence chain. Edited faces (e.g. morphs) can be made for research. The site's FAQ allows up to four sample images in a paper, but its formal terms say the materials can't be published without written consent, so get the permission form signed if your publisher asks. Sending images to cloud AI-editing tools is explicitly banned. Consent: all three sets used a signed, in-person release for research use, with payment (CFD: $20; CFD-MR: $20–$100; CFD-INDIA: Rs. 500, bilingual forms, read aloud where needed, University of Chicago IRB approval). None of the papers describes a way to withdraw. The FHIBE paper (Xiang et al., Nature 2025) notes CFD publishes no consent details on its site. Images were retouched (earrings, piercings and facial hair removed), except where CFD-INDIA models kept cultural or religious items. It's a psychology stimulus set with standardized poses and lighting, so it's not representative of faces in the wild.","verification":"Terms read at source","sources":"chicagofaces.org (terms of use, FAQ, image sets, version history); Ma, Correll & Wittenbrink (2015), Behavior Research Methods 47:1122–1135 (recruitment and consent); Ma, Kantner & Wittenbrink (2020), BRM 53:1289–1300 (Method: target recruitment, photographing; read 2026-11-11); Lakshmi et al. (2021), Frontiers in Psychology 12:627678 (Method and ethics statement; read 2026-11-11); Xiang et al. (2025), Nature 648:97–108 (consent comparison)","primary_url":"https://www.chicagofaces.org/","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#cfd","box":"Chicago Face Database"},{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#cfdmr","box":"CFD-MR"},{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#cfdindia","box":"CFD-INDIA"}]},{"id":"feret","name":"FERET","topics":["faces"],"full_name":"Facial Recognition Technology (FERET) database; distributed by NIST as Color FERET (Version 2)","year":1998,"status":"On request","role":["Face recognition training","Face recognition eval"],"images":14126,"identities":1199,"dataset_terms":"Color FERET Release Agreement v1: case-by-case release to face recognition researchers via NIST download only. No further distribution, publication, copying or dissemination in any form, for profit or not, including within your own organization. Images may appear only in technical reports and papers on face recognition research, at most 15 at a time. Mandatory acknowledgement and citation. Violations mean loss of access and civil damages for publishing unapproved images.","image_rights":"Photographed for the FERET program at George Mason University and US Army Research Laboratory facilities on 35mm colour film; George Mason University collected, processed and maintained the database. Distributed by NIST on behalf of the DoD Counterdrug Technology Development Program. No public licence on the images.","commercial_use":"Unclear","redistribution":"Prohibited","derivatives_allowed":"No","key_concerns":"Built by a US defense program to develop face recognition for security, intelligence and law enforcement. The terms are among the strictest here: no redistribution even inside your own organization. Publishing is limited to 15 images in papers \"reporting on face recognition research\", so a fairness study of face recognition fits, but work in another field (e.g. a hiring testbed that only uses the faces as inputs) may not. Commercial use isn't addressed directly; the release is to face recognition researchers on a case-by-case basis. Consent: neither the 1998 paper (full text read) nor NIST's pages or release agreement say how subjects were recruited, whether they consented or were paid. The sequestered test set also included digitally altered images (changes to scale, lighting and clothing colour), so the program itself edited real faces.","verification":"Terms read at source","sources":"NIST Color FERET page and Release Agreement v1 (read 2026-11-11); NIST FERET program page; Phillips, Wechsler, Huang & Rauss (1998), Image and Vision Computing 16(5):295–306 (full text read 2026-11-11: section 4.2 and acknowledgements); Phillips, Moon, Rizvi & Rauss (2000), IEEE TPAMI 22:1090–1104","primary_url":"https://www.nist.gov/itl/products-and-services/color-feret-database","maps":[{"title":"Shared provenance of face datasets","href":"face-image-datasets.html#feret","box":"FERET"}]},{"id":"flights","name":"Flights","topics":["data-quality"],"maps":[{"title":"Where data-cleaning benchmark datasets come from","href":"data-quality.html#flights","box":"Flights","fields":[["Original source","3 airline, 8 airport and 27 third-party websites (e.g. Orbitz, Travelocity), crawled Dec 2011"],["Also called","Flight"],["Real or synthetic","Real conflicts between sources"],["Path to recent benchmarks","Websites → Truth finding → HoloClean → Raha, Baran → ADR (Baran also cites Truth finding directly)"],["Sizes as reported","Truth finding 1,200 flights × 38 sources · HoloClean 2,377×6 · Raha/Baran/ADR 2,376×7, 30%"],["Where to get it","lunadong.com/fusionDataSets.htm; BigDaMa/raha repo (flights)"],["Source link","http://lunadong.com/fusionDataSets.htm"]]},{"title":"Where data-cleaning and fairness benchmark datasets come from","href":"fair-data-quality.html#flights","box":"Flights","fields":[["Original source","3 airline, 8 airport and 27 third-party websites (e.g. Orbitz, Travelocity), crawled Dec 2011"],["Also called","Flight"],["Real or synthetic","Real conflicts between sources"],["Path to recent benchmarks","Websites → Truth finding → HoloClean → Raha, Baran → ADR (Baran also cites Truth finding directly)"],["Sizes as re inal source","Kaggle competition \"Give Me Some Credit\" (credit distress prediction)"],["Also called","Give Me Some Credit"],["Real or synthetic","Real"],["Path to recent benchmarks","Kaggle → CleanML; Kaggle → demodq (TKDE)"],["Sizes as reported","CleanML 150,000×10 · TKDE 150,000 tuples, sensitive: age"],["Where to get it","kaggle.com/c/GiveMeSomeCredit"],["Note","CleanML and TKDE cite the same Kaggle competition data. TKDE builds on the CleanML code but cites Kaggle for the data."],["Source link","https://www.kaggle.com/c/GiveMeSomeCredit"]]}],"source":"Kaggle competition \"Give Me Some Credit\" (credit distress prediction)"},{"id":"german","name":"German credit","topics":["data-quality","fairness"],"maps":[{"title":"Where data-cleaning and fairness benchmark datasets come from","href":"fair-data-quality.html#german","box":"German credit","fields":[["Original source","Statlog (German Credit Data), UCI Machine Learning Repository"],["Also called","Statlog"],["Real or synthetic","Real"],["Path to recent benchmarks","UCI → demodq (TKDE)"],["Sizes as reported","TKDE 1,000 tuples, sensitive: age, sex"],["Where to get it","UCI Statlog (German Credit Data)"],["Note","TKDE drops foreign_worker, whose documented semantics are probably wrong. It derives sex from personal_status."],["Source link","https://archive.ics.uci.edu/ml/datasets/statlog+(german+credit+data)"]]}],"source":"Statlog (German Credit Data), UCI Machine Learning Repository"},{"id":"heart","name":"Heart","topics":["data-quality","fairness"],"maps":[{"title":"Where data-cleaning and fairness benchmark datasets come from","href":"fair-data-quality.html#heart","box":"Heart","fields":[["Original source","Cardiovascular Disease dataset (Kaggle, sulianova): patient measurements and presence of heart disease"],["Also called","Cardiovascular disease"],["Real or synthetic","Real patient measurements"],["Path to recent benchmarks","Kaggle → demodq (TKDE)"],["Sizes as reported","TKDE 70,000 tuples, sensitive: sex, age"],["Where to get it","kaggle.com/datasets/sulianova/cardiovascular-disease-dataset"],["Source link","https://www.kaggle.com/datasets/sulianova/cardiovascular-disease-dataset"]]}],"source":"Cardiovascular Disease dataset (Kaggle, sulianova): patient measurements and presence of heart disease"}],"site":{"nav":[{"label":"All maps","href":"index.html"},{"label":"Knowledge base","href":"kb.html"}],"maps":[{"href":"data-quality.html","title":"Where data-cleaning benchmark datasets come from"},{"href":"face-image-datasets.html","title":"Shared provenance of face datasets"},{"href":"fair-data-quality.html","title":"Where data-cleaning and fairness benchmark datasets come from"}]}}</script>
<script>
// ---- Generic knowledge-base renderer. All content comes from the JSON block above (built from data/kb.yaml). ----
const DATA = JSON.parse(document.getElementById('kb-data').textContent);
const TOP = DATA.topics || {}, FIELDS = DATA.fields || [], RECS = DATA.records || [], SITE = DATA.site || {};
const byId = Object.fromEntries(RECS.map(r => [r.id, r]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const has = v => v != null && v !== '' && !(Array.isArray(v) && !v.length);
document.title = DATA.title;
document.getElementById('title').textContent = DATA.title;
document.getElementById('lede').innerHTML = DATA.intro || '';
document.getElementById('foot').innerHTML = DATA.footer || '';
if (SITE.nav) { const n = document.getElementById('sitenav'); n.hidden = false; n.innerHTML = SITE.nav.filter(x => x.href !== 'kb.html').map(x => `<a href="${esc(x.href)}">${esc(x.label)}</a>`).join(''); }

const fmt = (f, v) => {
  if (f.type === 'ids') return v.map(i => byId[i] ? `<a href="#${encodeURIComponent(i)}">${esc(byId[i].name)}</a>` : esc(i)).join(', ');
  if (f.type === 'list') return v.map(x => `<span class="tag">${esc(x)}</span>`).join('');
  if (f.type === 'url') return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\//, '').replace(/\/$/, ''))} ↗</a>`;
  if (f.type === 'bool') return v ? 'Yes' : 'No';
  if (typeof v === 'number') return f.key === 'year' ? String(v) : v.toLocaleString('en-US');
  return esc(v);
};
const topicTags = r => (r.topics || []).map(t => `<span class="tag t-${esc(t)}">${esc((TOP[t] || {}).label || t)}</span>`).join('');
const mapsCell = r => (r.maps || []).map(m => `<a href="${esc(m.href)}" title="${esc(m.box)} on ${esc(m.title)}">${esc(m.title)}</a>`).join('<br>') || '—';
const haystack = r => [r.name, ...FIELDS.map(f => r[f.key]).flat(), ...(r.maps || []).flatMap(m => (m.fields || []).map(x => x[1]))].filter(has).join(' ').toLowerCase();
RECS.forEach(r => { r._h = haystack(r); });

// state: topic (?topic=…) and search
let topic = new URLSearchParams(location.search).get('topic') || 'all', q = '', sortKey = null, sortDir = 1, open = new Set();
if (topic !== 'all' && !TOP[topic]) topic = 'all';
const tbox = document.getElementById('topics');
const chips = [['all', 'All', RECS.length], ...Object.entries(TOP).map(([k, t]) => [k, t.label, RECS.filter(r => (r.topics || []).includes(k)).length])].map(([k, label, n]) => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.k = k;
  b.innerHTML = `${esc(label)}<span class="ct">${n}</span>`;
  b.addEventListener('click', () => { topic = k; const u = new URL(location); if (k === 'all') u.searchParams.delete('topic'); else u.searchParams.set('topic', k); history.replaceState(null, '', u); render(); });
  tbox.appendChild(b); return b;
});
document.getElementById('q').addEventListener('input', ev => { q = ev.target.value.trim().toLowerCase(); render(); });

const TABLE_FIELDS = FIELDS.filter(f => f.table);
function render() {
  chips.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === topic)));
  let vis = RECS.filter(r => (topic === 'all' || (r.topics || []).includes(topic)) && (!q || q.split(/\s+/).every(w => r._h.includes(w))));
  const cols = [{ key: 'name', label: 'Dataset' }, { key: 'topics', label: 'Topics' }, ...TABLE_FIELDS.filter(f => vis.some(r => has(r[f.key]))), { key: 'maps', label: 'On maps' }];
  if (sortKey) {
    const val = r => sortKey === 'maps' ? (r.maps || []).length : sortKey === 'topics' ? (r.topics || []).join() : r[sortKey];
    vis = [...vis].sort((a, b) => { const x = val(a), y = val(b); if (!has(x)) return 1; if (!has(y)) return -1; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir; });
  }
  document.querySelector('#tbl thead').innerHTML = `<tr>${cols.map(c => `<th data-k="${c.key}" aria-sort="${c.key === sortKey ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}">${esc(c.label)}</th>`).join('')}</tr>`;
  document.querySelectorAll('#tbl th').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); }));
  const tb = document.querySelector('#tbl tbody'); tb.innerHTML = '';
  vis.forEach(r => {
    const tr = document.createElement('tr'); tr.className = 'rec'; tr.id = r.id; tr.tabIndex = 0; tr.setAttribute('aria-expanded', String(open.has(r.id)));
    tr.innerHTML = cols.map(c => {
      if (c.key === 'name') return `<td><b>${esc(r.name)}</b>${r.full_name ? `<br><span class="sub">${esc(r.full_name)}</span>` : ''}</td>`;
      if (c.key === 'topics') return `<td>${topicTags(r)}</td>`;
      if (c.key === 'maps') return `<td>${mapsCell(r)}</td>`;
      return `<td>${has(r[c.key]) ? fmt(c, r[c.key]) : ''}</td>`;
    }).join('');
    const toggle = () => { open.has(r.id) ? open.delete(r.id) : open.add(r.id); render(); };
    tr.addEventListener('click', ev => { if (ev.target.closest('a')) return; toggle(); });
    tr.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
    tb.appendChild(tr);
    if (open.has(r.id)) {
      const dr = document.createElement('tr'); dr.className = 'detail';
      const fs = FIELDS.filter(f => f.key !== 'full_name' && has(r[f.key]));
      const maps = (r.maps || []).map(m => `<h3><a href="${esc(m.href)}">${esc(m.title)}</a>${m.box !== r.name ? ` <span class="sub">(as ${esc(m.box)})</span>` : ''}</h3>${m.fields && m.fields.length ? `<dl>${m.fields.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${/^https?:/.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)} ↗</a>` : esc(v)}</dd>`).join('')}</dl>` : ''}`).join('');
      dr.innerHTML = `<td colspan="${cols.length}">${fs.length ? `<dl>${fs.map(f => `<dt>${esc(f.label)}</dt><dd>${fmt(f, r[f.key])}</dd>`).join('')}</dl>` : ''}${maps ? `<div class="onmap">${maps}</div>` : ''}</td>`;
      tb.appendChild(dr);
    }
  });
  document.getElementById('count').textContent = `Showing ${vis.length} of ${RECS.length}`;
}
function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!byId[id]) return;
  const r = byId[id];
  if (topic !== 'all' && !(r.topics || []).includes(topic)) topic = 'all';
  if (q && !r._h.includes(q)) { q = ''; document.getElementById('q').value = ''; }
  open.add(id); render();
  const el = document.getElementById(id); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', fromHash);
render(); fromHash();
</script>
