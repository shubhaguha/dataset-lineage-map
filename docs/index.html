<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataset lineage maps</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #8a5cc7;
  --neutral: #898781;
  --band: rgba(11,11,11,0.025);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #9d75d6;
    --band: rgba(255,255,255,0.03);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 36px 28px 72px; }
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--text-secondary); font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
a.card { display: block; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--axis); }
a.card h2 { font-size: 17px; margin: 0 0 6px; color: var(--series-1); }
a.card p { margin: 0 0 8px; font-size: 13px; line-height: 1.45; color: var(--text-secondary); }
a.card p b { color: var(--text-primary); font-weight: 600; }
.meta { font-size: 12px; color: var(--muted); }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
</style>
</head>
<body>
<div class="viz-root"><div class="wrap">
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <h2 class="sec">Maps</h2>
  <div class="grid" id="maps"></div>
  <div id="kbsec"></div>
</div></div>
<script id="index-data" type="application/json">{"title":"Dataset lineage maps","intro":"Interactive maps of where datasets come from and how they are reused, built from YAML.","maps":[{"href":"data-quality.html","title":"Where data-cleaning benchmark datasets come from","intro":"Each line runs from where a paper says it got a dataset to the paper that used it, labelled with the dataset name. Recent benchmarks such as <b>Automatic Data Repair (VLDB 2024)<\/b> use the same handful of tables, which reach them through two or three papers. <b>Hospital<\/b> started as 100K rows from Hospital Compare, was cut to 1,000 rows by HoloClean, and every later paper reuses that sample. <b>Tax<\/b> is synthetic, generated by BART from a 2008 scenario by Fan et al. <b>IT<\/b>, <b>Rayyan<\/b> and probably <b>Address<\/b> are organisation-provided tables first described in <b>Detecting data errors (VLDB 2016)<\/b>. Pick a dataset below, or a box in the left column, to follow it through every paper. Hover over or tap a paper to see what it took and passed on.","counts":"23 boxes, 47 links"},{"href":"face-image-datasets.html","title":"Shared provenance of face datasets","intro":"Each line shows where a dataset's <b>images<\/b> came from. 21 of the 38 entries take their images from another dataset, and LFW alone has <b>20 known derivatives<\/b>, shown here as 5 individual datasets and 2 groups. <b>Six datasets have been withdrawn (dashed borders), and derivatives of four of those are still distributed.<\/b> RFW, BFW and LAOFIW take only their names from LFW: none of them contains LFW images. Hover or tap a dataset to trace its lineage. Columns give each dataset's <b>release year<\/b>; boxes on the right are <b>publications that document these datasets<\/b>, which can be greyed out or hidden.","counts":"43 boxes, 54 links"},{"href":"fair-data-quality.html","title":"Where data-cleaning and fairness benchmark datasets come from","intro":"Each line runs from where a paper says it got a dataset to the paper that used it, labelled with the dataset name. Recent benchmarks such as <b>Automatic Data Repair (VLDB 2024)<\/b> use the same handful of tables, which reach them through two or three papers. <b>Hospital<\/b> started as 100K rows from Hospital Compare, was cut to 1,000 rows by HoloClean, and every later paper reuses that sample. <b>Tax<\/b> is synthetic, generated by BART from a 2008 scenario by Fan et al. <b>IT<\/b>, <b>Rayyan<\/b> and probably <b>Address<\/b> are organisation-provided tables first described in <b>Detecting data errors (VLDB 2016)<\/b>. Pick a dataset below, or a box in the left column, to follow it through every paper. Hover over or tap a paper to see what it took and passed on.","counts":"27 boxes, 54 links"}],"kb":{"href":"kb.html","count":63,"intro":"Provenance, terms and consent for the datasets on the lineage maps. Filter by topic, search, or open a record to see every field and the maps it appears on."}}</script>
<script>
const DATA = JSON.parse(document.getElementById('index-data').textContent);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
document.getElementById('title').textContent = DATA.title;
document.getElementById('lede').textContent = DATA.intro || '';
// first sentence of each map's intro, keeping its simple HTML
const first = s => { const m = String(s).match(/^.*?[.!?](\s|$)/); return m ? m[0] : s; };
document.getElementById('maps').innerHTML = DATA.maps.map(m => `<a class="card" href="${esc(m.href)}"><h2>${esc(m.title)}</h2><p>${first(m.intro)}</p><span class="meta">${esc(m.counts)}</span></a>`).join('');
if (DATA.kb) document.getElementById('kbsec').innerHTML = `<h2 class="sec">Knowledge base</h2><div class="grid"><a class="card" href="${esc(DATA.kb.href)}"><h2>Dataset knowledge base</h2><p>${esc(DATA.kb.intro)}</p><span class="meta">${DATA.kb.count} records</span></a></div>`;
</script>
</body>
</html>
