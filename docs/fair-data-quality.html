<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #8a5cc7;
  --neutral: #898781;
  --band: rgba(11,11,11,0.025);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #9d75d6;
    --band: rgba(255,255,255,0.03);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 28px 28px 72px; }
header { max-width: 1500px; margin: 0 auto 14px; }
h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--text-secondary); font-size: 14.5px; line-height: 1.5; max-width: 900px; margin: 0; }
.lede b { color: var(--text-primary); font-weight: 600; }
.sitenav { display: flex; gap: 16px; font-size: 13px; margin: 0 0 10px; }
.sitenav a { color: var(--series-1); text-decoration: none; font-weight: 600; }
.sitenav a:hover { text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 14px 0 0; font-size: 12.5px; color: var(--text-secondary); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; display: inline-block; }
.ln { width: 26px; height: 0; border-top: 1.75px solid var(--muted); display: inline-block; }
.ln.dash { border-top-style: dashed; }
.ln.dot { border-top-style: dotted; border-top-width: 2px; }
.tracer { max-width: 1500px; margin: 0 auto 14px; padding: 14px 16px 12px; }
.tracer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
.tracer-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
.tracer-hint { font-size: 12.5px; color: var(--text-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 7px 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 12.5px; }
.toolbar { max-width: 1500px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12.5px; }
.toolbar .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 600; margin-right: 4px; }
.dchip { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 13px 7px 10px; border-radius: 999px; border: 1.5px solid var(--axis); background: var(--surface-1); color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.dchip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dchip:hover { border-color: var(--axis); }
.dchip[aria-pressed="true"] { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
.dchip .ct { color: var(--muted); font-size: 11.5px; font-weight: 500; }
.dchip[aria-pressed="true"] .ct { color: var(--axis); }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); cursor: pointer; user-select: none; }
.layout { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1050px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
.chart { padding: 10px; overflow: hidden; }
svg { display: block; width: 100%; height: auto; }
.lane-band { fill: var(--band); }
.lane-label { font-size: 11px; fill: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
.edge.dashed { stroke-dasharray: 5 4; }
.edge.dotted { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.edge.quiet { opacity: 0.3; }
svg.focusing .edge.quiet.on { opacity: 1; }
.col-label { font-size: 11px; fill: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.col-sep { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
.tg-grey { opacity: 0.25; }
svg.focusing .node.tg-grey:not(.dim), svg.focusing .edge.tg-grey.on { opacity: 0.6; }
tr.tg-grey { opacity: 0.45; }
.tg-hide { display: none; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; margin-right: 14px; }
.seg button { font: inherit; font-size: 12.5px; padding: 4px 11px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--page); }
.node.dashed rect.body { stroke-dasharray: 6 4; }
.box-dash { width: 18px; height: 12px; border: 1.75px dashed var(--text-secondary); border-radius: 3px; display: inline-block; }
.chain { font-size: 13px; line-height: 1.6; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 9; cursor: help; }
.edge-label { font-size: 10.5px; fill: var(--text-primary); paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .15s; }
svg.alllabels .edge-label { opacity: 1; }
svg.focusing .edge-label.on { opacity: 1; }
svg.focusing.alllabels .edge-label.dim { opacity: 0.12; }
.node { cursor: pointer; transition: opacity .15s; outline: none; }
.node rect.body { stroke-width: 2; }
.node .name { font-size: 12.5px; font-weight: 600; fill: var(--text-primary); }
.node .sub { font-size: 10.5px; fill: var(--text-secondary); }
.node .hit { fill: transparent; }
.node.dsnode .name { font-size: 13.5px; }
.node:focus-visible rect.body, .node.pinned rect.body { stroke-width: 3; }
svg.focusing .node.dim, svg.focusing .edge.dim { opacity: 0.12; }
svg.focusing .edge.on { stroke-width: 2.3; stroke: var(--text-secondary); }
.panel { padding: 18px 18px 16px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.panel .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 14px 0 4px; }
.panel h2 { font-size: 19px; margin: 0 0 2px; font-weight: 600; }
.panel .full { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 8px; line-height: 1.4; }
.panel p { margin: 0; font-size: 13px; line-height: 1.45; }
.panel ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; }
.panel li { margin-bottom: 5px; }
.panel li .from { color: var(--text-secondary); }
.panel .ds { font-weight: 600; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); margin: 2px 4px 2px 0; color: var(--text-primary); }
.chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.links { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.links a, .panel a { color: var(--series-1); text-decoration: none; font-weight: 600; }
.links a:hover, .panel a:hover { text-decoration: underline; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
details.table { max-width: 1500px; margin: 18px auto 0; padding: 12px 16px; }
details.table summary { cursor: pointer; font-weight: 600; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
td a { color: var(--series-1); }
td.sz { font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot { max-width: 1500px; margin: 14px auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
@media print {
  .viz-root { padding: 10mm; min-height: 0; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel, .toolbar { display: none; }
  details.table { break-before: page; }
  details.table > *:not(summary) { display: block; }
  @page { size: A4 landscape; margin: 8mm; }
}
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <nav class="sitenav" id="sitenav" hidden></nav>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="legend" id="legend" aria-label="Legend"></div>
  </header>

  <section class="card tracer" id="tracer" aria-label="Trace a dataset">
    <div class="tracer-head"><h2>Trace a dataset</h2><span class="tracer-hint">Pick one to follow it from its origin through every paper that used it. The boxes in the left column of the map do the same. The number is how many links carry it.</span></div>
    <div class="chips" id="chips"></div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="labelToggle"> Show all line labels</label>
    </div>
  </section>

  <div class="toolbar" id="toolbar" hidden></div>
  <div class="layout">
    <div class="card chart"><svg id="viz" role="img" aria-labelledby="vizTitle"><title id="vizTitle"></title></svg></div>
    <aside class="card panel" id="panel" aria-live="polite">
      <p class="hint" id="hint"></p>
    </aside>
  </div>

  <details class="card table" id="dtable" open>
    <summary>Dataset table</summary>
    <table id="dtbl"><thead><tr><th>Dataset</th><th>Original source</th><th>Real or synthetic</th><th>Path to recent benchmarks</th><th>Sizes as reported</th><th>Where to get it</th></tr></thead><tbody></tbody></table>
  </details>
  <details class="card table">
    <summary id="ntitle"></summary>
    <table id="ntbl"><thead></thead><tbody></tbody></table>
  </details>
  <p class="foot" id="foot"></p>
</div>

<script id="lineage-data" type="application/json">{"page_title":"Data Quality and Fairness Lineage Map","title":"Where data-cleaning and fairness benchmark datasets come from","intro":"Each line runs from where a paper says it got a dataset to the paper that used it, labelled with the dataset name. Recent benchmarks such as <b>Automatic Data Repair (VLDB 2024)<\/b> use the same handful of tables, which reach them through two or three papers. <b>Hospital<\/b> started as 100K rows from Hospital Compare, was cut to 1,000 rows by HoloClean, and every later paper reuses that sample. <b>Tax<\/b> is synthetic, generated by BART from a 2008 scenario by Fan et al. <b>IT<\/b>, <b>Rayyan<\/b> and probably <b>Address<\/b> are organisation-provided tables first described in <b>Detecting data errors (VLDB 2016)<\/b>. Pick a dataset below, or a box in the left column, to follow it through every paper. Hover over or tap a paper to see what it took and passed on.","svg_title":"Lineage graph of data-cleaning benchmark datasets, from original sources (left) to the papers that use them (right), by year","panel_hint":"Select a paper or source to see which datasets it used, where each came from and who reused them. Pick a dataset chip above to follow one table through every paper.<br><br>Hover over a line to see the citing paper's own description of that dataset.","footer":"Sources: the dataset sections and references of each paper on the map, read in full (ADR, Raha, Baran, HoloClean, BART, Detecting data errors, Holistic, NADEEF, Truth finding, REIN, CleanML, demodq TKDE 2024), CleanML's dataset descriptions and the BigDaMa/raha GitHub repository (November 2026). Dashed links are inferences, not claims made by the authors. Download links come from the papers and were not re-checked.","links_legend":{"paper":"Source stated in the citing paper","inferred":"Inferred (matching table shapes)"},"columns":["Original data","2013","2015–2016","2017","2019–2023","2024"],"kinds":{"paper":{"label":"Paper","legend":"Paper (system or benchmark)","color":"series-1"},"open":{"label":"Public source","legend":"Public source (open data portal, web, repository)","color":"series-3"},"org":{"label":"Organisation-provided / proprietary","legend":"Organisation-provided or proprietary","color":"series-2"},"synth":{"label":"Synthetic scenario","legend":"Synthetic scenario","color":"series-4"},"unk":{"label":"Origin not traced","legend":"Origin not traced","color":"neutral"}},"datasets":[{"id":"flights","name":"Flights","source":"38 flight-status sites","source_full":"3 airline, 8 airport and 27 third-party websites (e.g. Orbitz, Travelocity), crawled Dec 2011","kind":"open","url":"http://lunadong.com/fusionDataSets.htm","aka":"Flight","real":"Real conflicts between sources","path":"Websites → Truth finding → HoloClean → Raha, Baran → ADR (Baran also cites Truth finding directly)","sizes":"Truth finding 1,200 flights × 38 sources · HoloClean 2,377×6 · Raha/Baran/ADR 2,376×7, 30%","get":"lunadong.com/fusionDataSets.htm; BigDaMa/raha repo (flights)"},{"id":"food","name":"Food","source":"Chicago Data Portal","source_full":"City of Chicago open data: food inspections","kind":"open","url":"https://data.cityofchicago.org/","real":"Real; transcribed inspector forms","path":"Chicago Data Portal → HoloClean","sizes":"HoloClean 339,908×17","get":"data.cityofchicago.org"},{"id":"physicians","name":"Physicians","source":"Medicare Physician Compare","source_full":"Medicare.gov Physician Compare National dataset","kind":"open","url":"https://data.medicare.gov/data/physician-compare","real":"Real","path":"Medicare.gov → HoloClean","sizes":"HoloClean 2,071,849×18","get":"data.medicare.gov"},{"id":"hospital","name":"Hospital","source":"US HHS Hospital Compare","source_full":"US Dept. of Health & Human Services, hospitalcompare.hhs.gov","kind":"open","url":"https://www.hospitalcompare.hhs.gov/","aka":"HOSP","real":"Real data, injected errors","path":"Hospital Compare → Holistic / NADEEF → HoloClean (1,000-row sample) → Raha, Baran → ADR","sizes":"Holistic 100K×19 · NADEEF 100K · HoloClean 1,000×19, ~5% errors · Raha/Baran/ADR 1,000×20, 3%","get":"BigDaMa/raha repo (hospital)","note":"Holistic and Baran say the errors were introduced artificially. Baran calls them \"scarce and randomly imposed\"."},{"id":"zip","name":"US ZIP codes","source":"databases.about.com","source_full":"Zip code table from databases.about.com, master data for HOSP","kind":"open","url":"http://databases.about.com/od/access/a/zipcodedatabase.htm","real":"Real master data","path":"ZIP table → NADEEF (to accompany HOSP)","sizes":"43K×2 (zip, state)","get":"Original page likely gone"},{"id":"bus","name":"Bus","source":"data.gov.uk, 8 tables","source_full":"UK government public datasets, 8 tables joined","kind":"open","url":"https://www.data.gov.uk/data","aka":"BUS","real":"Real","path":"data.gov.uk → NADEEF → BART","sizes":"NADEEF 160K, 16 attributes in rules · BART 250K","get":"data.gov.uk"},{"id":"client","name":"CLIENT","source":"Bertossi et al. 2005","source_full":"Bertossi et al., Complexity and approximation of fixing numerical attributes in databases under integrity constraints (DBPL 2005)","kind":"synth","real":"Not checked","path":"Bertossi et al. → Holistic","sizes":"100K tuples, 6 attributes, 2 relations","get":"da.qcri.org/hc/data.zip (per Holistic)"},{"id":"tax","name":"Tax","source":"Fan et al. 2008 scenario","source_full":"Fan, Geerts, Jia, Kementsietsidis, Conditional Functional Dependencies for Capturing Data Inconsistencies (ACM TODS 33, 2008)","kind":"synth","real":"Synthetic","path":"Fan et al. 2008 → BART (generator) → Raha, Baran, ADR","sizes":"BART 100K–1M · Raha/Baran/ADR 200,000×15, 4% (ADR also uses a 10K subset)","get":"BART repository; BigDaMa/raha repo (tax)"},{"id":"customers","name":"Customers","source":"Geerts et al. 2014","source_full":"Geerts, Mecca, Papotti, Santoro, Mapping and Cleaning (ICDE 2014), the LLUNATIC project","kind":"synth","real":"Synthetic","path":"Geerts et al. → BART","sizes":"BART 100K–1M","get":"BART repository"},{"id":"rayyan","name":"Rayyan","source":"Rayyan app (QCRI)","source_full":"Rayyan: a web and mobile app for systematic reviews (Systematic Reviews 2016); data from its reference database","kind":"org","url":"https://doi.org/10.1186/s13643-016-0384-4","aka":"Rayyan Bib","real":"Real, cleaned by the owners","path":"Rayyan → Detecting data errors (Rayyan Bib) → Raha, Baran → ADR (ADR cites Raha)","sizes":"DDE: 1M rows×11, 1K-row partial ground truth, 35% errors · Raha/Baran/ADR 1,000×11, 9%","get":"BigDaMa/raha repo (rayyan)","note":"Raha and Baran cite the Rayyan app paper. The 1,000-row, 11-column table matches DDE's ground-truth sample of Rayyan Bib (inferred). The error rates differ (35% vs 9%)."},{"id":"beers","name":"Beers","source":"Kaggle Craft Beers","source_full":"Jean-Nicholas Hould, Craft Beers Dataset, Kaggle 2017 (v1)","kind":"open","url":"https://www.kaggle.com/datasets/nickhould/craft-cans","aka":"Craft Beers","real":"Real, cleaned by the dataset owner","path":"Kaggle → Raha, Baran → ADR (ADR cites Baran)","sizes":"2,410×11, 16%","get":"Kaggle; BigDaMa/raha repo (beers)"},{"id":"movies","name":"Movies","source":"Magellan repository","source_full":"The Magellan Data Repository (Das et al. 2015), AnHai Doan's group","kind":"open","url":"https://sites.google.com/site/anhaidgroup/projects/data","aka":"movies_1","real":"Real; ground truth from duplicate labels","path":"Magellan → Raha","sizes":"Raha 7,390×17, 6%","get":"Magellan repository; BigDaMa/raha repo (movies_1)"},{"id":"mitvpf","name":"MIT VPF","source":"MIT procurement records","source_full":"MIT Office of the Vice President for Finance: vendor master data","kind":"org","real":"Real, owner-curated ground truth","path":"MIT → Detecting data errors (not reused downstream)","sizes":"DDE 24K×42, 13,603-record partial ground truth, 6.7%","get":"Not public"},{"id":"it","name":"IT","source":"Merck IT department","source_fu <script>

// datasets: the traced left-column boxes (id = dataset key); nodes/papers: all other boxes
const DSLIST = DATA.datasets || [];
const NODES = [...(DATA.papers || []), ...(DATA.nodes || [])];
const D = [
  ...DSLIST.map((d, i) => ({ id: d.id, name: d.name, sub: d.source || '', full: d.source_full || d.source || '', c: 0, y: posY(d, i), k: d.kind, refs: refsOf(d, false), isDs: true })),
  ...NODES.map(p => { const k = p.kind || 'paper'; return { id: p.id, name: p.name, sub: p.subtitle || '', full: p.full || p.name, c: p.column, y: posY(p), k, refs: refsOf(p, k === 'paper'), note: p.note, status: p.status, attrs: p.attrs || {}, own: p.created && p.created.length ? p.created.map(t => ['', t]) : undefined, year: p.year_label || (p.year != null ? String(p.year) : ''), yearNote: p.year_note }; })
];

  const nm = id => mode(byId[id].k);
  D.forEach(d => { const m = nm(d.id); [nodeEls[d.id], rowEls[d.id]].forEach(x => { x.classList.toggle('tg-grey', m === 'grey'); x.classList.toggle('tg-hide', m === 'hide'); }); });
  E.forEach((e, i) => { const m = [nm(e.s), nm(e.t)].includes('hide') ? 'hide' : [nm(e.s), nm(e.t)].includes('grey') ? 'grey' : 'show'; [edgeEls[i], edgeEls[i].nextSibling, labelEls[i]].forEach(x => { x.classList.toggle('tg-grey', m === 'grey'); x.classList.toggle('tg-hide', m === 'hide'); }); });
  // in-table mentions of hidden nodes
  nt.querySelectorAll('[data-node]').forEach(s => s.classList.toggle('tg-hide', nm(s.dataset.node) === 'hide'));
  // shrink the drawing when whole columns are hidden
  const vis = D.filter(d => nm(d.id) !== 'hide'), w = LAY.width || Math.max(...vis.map(d => d.x)) + W + 16;
  svg.setAttribute('viewBox', `0 0 ${w} ${VH}`);
  svg.querySelectorAll('rect.lane-band').forEach(r => r.setAttribute('width', w - 20));
  svg.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('tg-hide', COLS[+x.dataset.col].x >= w));
  if (LAY.min_width) svg.style.minWidth = Math.round(LAY.min_width * w / VW) + 'px';
  if (pinned) renderNode(pinned);
}
if (TOGS.length) {
  const bar = document.getElementById('toolbar'); bar.hidden = false;
  TOGS.forEach(t => {
    const lab = document.createElement('span'); lab.className = 'lbl'; lab.textContent = t.label; bar.appendChild(lab);
    const seg = document.createElement('span'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', t.label);
    [['show', 'Show'], ['grey', 'Grey out'], ['hide', 'Hide']].forEach(([m, txt]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.dataset.m = m;
      b.setAttribute('aria-pressed', String(t.mode === m));
      b.addEventListener('click', () => { t.mode = m; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === m))); applyToggles(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
  });
  applyToggles();
}

// site navigation and deep links (map.html#<box id> selects that box)
if (SITE.nav) {
  const nav = document.getElementById('sitenav'); nav.hidden = false;
  nav.innerHTML = SITE.nav.map(n => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join('');
}
function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!byId[id]) return;
  if (byId[id].isDs) { activeDs = null; showDs(id); } else { pinned = null; pin(id); }
  if (nodeEls[id].scrollIntoView) nodeEls[id].scrollIntoView({ block: 'center', behavior: 'smooth' });
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
